## Modifikasi Berkas Proyek

Perbarui dua berkas di repository Anda (`index.html` dan `Dockerfile`):

### 1. Perbarui `index.html`

Ganti seluruh isi berkas `index.html` dengan kode di bawah. Kode ini memanfaatkan pustaka `qrcodejs` via CDN untuk membuat QR Code secara instant di browser:

```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaskeun Gateway & Generator</title>
    <!-- Script QR Code Generator -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js](https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js)"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); text-align: center; max-width: 480px; width: 100%; border: 1px solid #334155; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(34, 197, 94, 0.1); color: #4ade80; padding: 0.4rem 0.8rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1.2rem; border: 1px solid rgba(34, 197, 94, 0.2); }
        .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; }
        h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.2rem; }
        
        .input-group { text-align: left; margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.3rem; font-weight: 600; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 0.6rem 0.8rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc; font-size: 0.85rem; }
        
        #qrcode { background: #ffffff; padding: 0.8rem; border-radius: 0.5rem; display: inline-block; margin: 1rem 0; }
        #qrcode img { margin: 0 auto; }

        .btn { width: 100%; padding: 0.7rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        .btn:hover { background: #1d4ed8; }
        .btn:active { background: #1e40af; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            <span class="dot"></span> VLESS Gateway Active
        </div>
        <h1>Gaskeun Config Generator</h1>
        <p>Masukkan UUID Anda di bawah untuk membuat URL konfigurasi dan QR Code secara otomatis.</p>

        <div class="input-group">
            <label for="uuidInput">User UUID</label>
            <input type="text" id="uuidInput" placeholder="Masukkan UUID Anda di sini..." oninput="generateConfig()">
        </div>

        <div id="qrcode"></div>

        <button class="btn" onclick="copyLink()">Copy VLESS Link</button>
    </div>

    <script>
        let qr = new QRCode(document.getElementById("qrcode"), { width: 160, height: 160 });
        let currentVlessUrl = "";

        function generateConfig() {
            const uuid = document.getElementById("uuidInput").value.trim();
            const host = window.location.hostname;
            
            if (!uuid) {
                document.getElementById("qrcode").style.display = "none";
                currentVlessUrl = "";
                return;
            }

            document.getElementById("qrcode").style.display = "inline-block";
            currentVlessUrl = `vless://${uuid}@${host}:443?type=ws&security=tls&path=%2Fvless&sni=${host}#Railway-VLESS`;
            
            qr.clear();
            qr.makeCode(currentVlessUrl);
        }

        function copyLink() {
            if (!currentVlessUrl) {
                alert("Silakan masukkan UUID terlebih dahulu!");
                return;
            }
            navigator.clipboard.writeText(currentVlessUrl).then(() => {
                alert("Link VLESS berhasil disalin ke clipboard!");
            });
        }

        // Jalankan saat pertama kali dibuka
        generateConfig();
    </script>
</body>
</html>
